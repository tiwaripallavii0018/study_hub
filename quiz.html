<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Quizzes - StudyHub</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your main CSS -->
    <style>
        /* Additional styles specific to quiz */
        .quiz-container {
            max-width: 800px;
            margin: 100px auto 2rem;
            padding: 2rem;
            background-color: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        body.dark .quiz-container {
            background-color: #333;
            color: #fff;
        }
        .question {
            margin-bottom: 2rem;
        }
        .options {
            display: flex;
            flex-direction: column;
        }
        .option {
            margin: 0.5rem 0;
            padding: 1rem;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .option:hover {
            background-color: #e0e0e0;
        }
        body.dark .option {
            background-color: #444;
            border-color: #666;
        }
        .option.selected {
            background-color: #ff6b35;
            color: white;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }
        .results {
            text-align: center;
            margin-top: 2rem;
        }
        .score-animation {
            font-size: 2rem;
            color: #ff6b35;
            animation: reveal 2s ease-in-out;
        }
        @keyframes reveal {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        .revision-mode {
            margin-top: 1rem;
        }
        .revision-mode button {
            padding: 0.5rem 1rem;
            background-color: #ff6b35;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .difficulty-filter {
            margin-bottom: 1rem;
        }
        .difficulty-filter select {
            padding: 0.5rem;
            border-radius: 5px;
        }
    </style>
</head>
<body class="light">
    <nav>
        <!-- Same nav as index.html for consistency -->
        <div class="nav-left">
            <div class="logo"><a href="index.html" style="color: white; text-decoration: none;">StudyHub</a></div>
            <div class="features">
                <button onclick="toggleDropdown()">Features ▼</button>
                <div class="dropdown" id="dropdown">
                    <ul>
                        <li><a href="dashboard.html">📊 Progress Dashboard</a></li>
                        <li>🎯 Daily Challenge</li>
                        <li><a href="quiz.html">🧠 Smart Quizzes</a></li>
                        <li>🔁 Mistake Revision Mode</li>
                        <li>📈 Performance Analytics</li>
                        <li>📚 Downloadable Notes</li>
                        <li>🧩 Flashcards</li>
                        <li>🏆 Mock Exam Simulator</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-bar">
                <input type="text" placeholder="Search topics..." id="search">
            </div>
            <button class="login-btn" onclick="login()">Login</button>
            <button class="signin-btn" onclick="signin()">Sign In</button>
            <div class="profile" id="profile">
                <span>Welcome, User!</span>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </nav>

    <div class="quiz-container">
        <h1>Smart Quizzes</h1>
        <div class="difficulty-filter">
            <label for="difficulty">Select Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="moderate">Moderate</option>
                <option value="exam">Exam Level</option>
            </select>
        </div>
        <div id="quiz-content">
            <!-- Questions will be loaded here -->
        </div>
        <div class="controls">
            <button id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
            <button id="next-btn" onclick="nextQuestion()">Next</button>
            <button id="submit-btn" onclick="submitQuiz()" style="display: none;">Submit Quiz</button>
        </div>
        <div class="revision-mode">
            <button onclick="startRevision()">Practice Wrong Answers</button>
        </div>
        <div id="results" class="results" style="display: none;">
            <h2>Quiz Results</h2>
            <div class="score-animation" id="score-display"></div>
            <p id="topic-breakdown"></p>
            <button onclick="location.href='dashboard.html'">View Dashboard</button>
        </div>
    </div>

    <script>
        // Sample questions (expand with your own; categorized by difficulty)
        const questions = {
            easy: [
                { question: "What is the capital of France?", options: ["Paris", "London", "Berlin", "Madrid"], answer: 0, topic: "Geography" },
                { question: "What is 2 + 2?", options: ["3", "4", "5", "6"], answer: 1, topic: "Math" },
                // Add more...
            ],
            moderate: [
                { question: "Who wrote 'To Kill a Mockingbird'?", options: ["Harper Lee", "J.K. Rowling", "Mark Twain", "Ernest Hemingway"], answer: 0, topic: "Literature" },
                { question: "What is the largest planet in our solar system?", options: ["Earth", "Mars", "Jupiter", "Saturn"], answer: 2, topic: "Science" },
                // Add more...
            ],
            exam: [
                { question: "In AWS, what does EC2 stand for?", options: ["Elastic Compute Cloud", "Easy Cloud Compute", "Elastic Cloud Compute", "None"], answer: 0, topic: "AWS" },
                { question: "What is the speed of light?", options: ["3x10^8 m/s", "3x10^6 m/s", "3x10^10 m/s", "3x10^4 m/s"], answer: 0, topic: "Physics" },
                // Add more...
            ]
        };

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let wrongAnswers = JSON.parse(localStorage.getItem('wrongAnswers')) || [];
        let isRevisionMode = false;

        // Load questions based on difficulty
        document.getElementById('difficulty').addEventListener('change', loadQuiz);
        loadQuiz();

        function loadQuiz() {
            const difficulty = document.getElementById('difficulty').value;
            currentQuestions = questions[difficulty];
            currentQuestionIndex = 0;
            userAnswers = [];
            displayQuestion();
        }

        function startRevision() {
            if (wrongAnswers.length === 0) {
                alert('No wrong answers to revise!');
                return;
            }
            isRevisionMode = true;
            currentQuestions = wrongAnswers;
            currentQuestionIndex = 0;
            userAnswers = [];
            displayQuestion();
        }

        function displayQuestion() {
            const question = currentQuestions[currentQuestionIndex];
            const quizContent = document.getElementById('quiz-content');
            quizContent.innerHTML = `
                <div class="question">
                    <h3>${question.question}</h3>
                    <div class="options">
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectOption(${index})">${option}</div>
                        `).join('')}
                    </div>
                </div>
            `;
            updateControls();
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => opt.classList.toggle('selected', i === index));
            // Sound feedback (add your sound files)
            const audio = new Audio(index === currentQuestions[currentQuestionIndex].answer ? 'correct.mp3' : 'wrong.mp3');
            audio.play();
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function updateControls() {
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            document.getElementById('next-btn').style.display = currentQuestionIndex < currentQuestions.length - 1 ? 'inline' : 'none';
            document.getElementById('submit-btn').style.display = currentQuestionIndex === currentQuestions.length - 1 ? 'inline' : 'none';
        }

        function submitQuiz() {
            let score = 0;
            let topicStats = {};
            wrongAnswers = [];
            userAnswers.forEach((answer, index) => {
                const question = currentQuestions[index];
                if (answer === question.answer) {
                    score++;
                } else {
                    wrongAnswers.push(question);
                }
                topicStats[question.topic] = (topicStats[question.topic] || 0) + (answer === question.answer ? 1 : 0);
            });
            // Save to localStorage
            const attempts = JSON.parse(localStorage.getItem('quizAttempts')) || [];
            attempts.push({ score, total: currentQuestions.length, date: new Date().toISOString() });
            localStorage.setItem('quizAttempts', JSON.stringify(attempts));
            localStorage.setItem('wrongAnswers', JSON.stringify(wrongAnswers));

            // Display results
            document.getElementById('quiz-content').style.display = 'none';
            document.querySelector('.controls').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            document.getElementById('score-display').textContent = `Score: ${score}/${currentQuestions.length}`;
            document.getElementById('topic-breakdown').textContent = `Topic Breakdown: ${Object.entries(topicStats).map(([topic, correct]) => `${topic}: ${correct}/${currentQuestions.filter(q => q.topic === topic).length}`).join(', ')}`;
        }

        // Reuse nav functions from index.html
        function toggleDropdown() {
            const dropdown = document.getElementById('dropdown');
            dropdown.classList.toggle('show');
        }
        function login() { /* Same as index */ }
        function signin() { /* Same as index */ }
        function toggleTheme() {
            document.body.classList.toggle('dark');
            document.body.classList.toggle('light');
            const toggleBtn = document.querySelector('.theme-toggle');
            toggleBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        }
    </script>
</body>
</html>
